name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter os ficheiros do repositório
        uses: actions/checkout@v4
      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o Pillow (imagens)
        run: pip install pillow
      - name: Gerar o site
        run: python gerador/build.py
      - name: Preparar o site para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Avisar o Bing e outros motores (IndexNow)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          KEY='ff36041429c8421a1bf64647f7ac8dbb'
          S='https://henriquelonga.pt'
          x=urllib.request.urlopen(S+'/sitemap.xml',timeout=30).read().decode()
          urls=re.findall(r'<loc>([^<]+)</loc>',x)
          d=json.dumps({'host':'henriquelonga.pt','key':KEY,'keyLocation':S+'/'+KEY+'.txt','urlList':urls}).encode()
          r=urllib.request.Request('https://api.indexnow.org/indexnow',d,{'Content-Type':'application/json; charset=utf-8'})
          print(urllib.request.urlopen(r,timeout=30).status)
          PY
