name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter os ficheiros do repositório
        uses: actions/checkout@v4
      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o Pillow (imagens)
        run: pip install pillow
      - name: Gerar o site
        run: python gerador/build.py
      - name: Preparar o site para publicar
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
